name = "agentravel-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "agentravel-db"
database_id = "fe50cba5-cf1a-4749-b436-70849dffc49d"
migrations_dir = "drizzle"

# Environment variables (set via wrangler secret put)
[vars]
ENVIRONMENT = "development"

# Build configuration
[build]
command = ""

# Development configuration
[dev]
port = 8787
